groups:
  - name: doorboard_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service down: {{ $labels.job }}"
          description: "Service {{ $labels.job }} is unreachable for more than 1 minute."

      - alert: StorageLow
        expr: door_media_ssd_free_bytes < 10737418240
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Storage low on SSD mount"
          description: "Free space on the media SSD is {{ $value | humanize1024 }}."

      - alert: SyncQueueAging
        expr: (door_media_oldest_unsynced_s > 14400) or (door_sync_oldest_pending_s > 14400)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sync queue aging threshold exceeded"
          description: "Sync backlog contains items older than 4 hours (current max age: {{ $value }}s)."

      - alert: ESP32Offline
        # door-api's name for it; `esp32_link_connected` never existed.
        expr: door_api_esp32_link_enabled == 1 and door_api_esp32_link_connected == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ESP32 offline"
          description: "The ESP32 link has been disconnected for more than 1 minute."

      - alert: PiThrottling
        # prometheus-node-exporter on the Pi (infra/systemd/node-exporter.service),
        # scraped as /metrics/node through the proxy. The thermal_zone collector
        # names the Pi 5 SoC sensor `cpu-thermal`; the label needs on-device
        # confirmation (`curl -s http://door-pi.local/metrics/node | grep thermal`).
        expr: node_thermal_zone_temp{type="cpu-thermal"} > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Pi thermal throttling"
          description: "Pi CPU temperature is extremely high: {{ $value }}°C."

      - alert: MediaStreamDown
        expr: door_media_stream_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Camera stream is down"
          description: >-
            door_media reports the MediaMTX stream down for more than 2 minutes: a black or
            frozen camera, so recordings and the recognition snapshot are dead. Undetectable
            end-to-end without this alert.

      - alert: SyncDeadLetter
        expr: door_sync_dead_letter_total > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "door-sync has dead-lettered items"
          description: >-
            {{ $value }} item(s) are in door-sync's dead-letter state — a clip, thumbnail, or
            event that will never reach the NAS/NUC without operator action.

      - alert: OutboxDeadLetter
        expr: (door_api_media_outbox_dead_total > 0) or (door_api_sync_outbox_dead_total > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "door-api has dead-lettered outbox events"
          description: >-
            A door-api outbox event was retried past its cap and parked (dead-lettered): a
            recording/session mirror the NUC will never receive without operator action.

      - alert: AlertmanagerReceiverFailing
        # Self-check: the only receiver is control-plane-api's POST /admin/alerts.
        # When it fails, nothing reaches the owner — including this alert. It is
        # read on the Prometheus/Alertmanager UI, never delivered (README.md).
        expr: increase(alertmanager_notifications_failed_total[10m]) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager cannot deliver to control-plane-api"
          description: >-
            Alertmanager's webhook to control-plane-api /admin/alerts is failing, so no
            alert (this one included) reaches the owner. Check control-plane-api's health
            and that CONTROL_PLANE_ADMIN_TOKEN matches on both sides.
