# Home Assistant config for the doorboard NUC bridge (T-503).
#
# Bind-mounted read-only into the `home-assistant` container's /config in
# infra/compose/docker-compose.yml and compose.dev.yml. HA's own runtime
# state (`.storage/`, `home-assistant_v2.db`, logs) lives in the `ha_data`
# named Docker volume, never in this repo — nothing under this directory is
# ever written to by HA itself.
#
# ADR-0002: HA is an integration surface, never a dependency of the door
# path — if HA is down, the door doesn't notice. Nothing configured here
# gates door behavior; entities are display/notification only.

default_config:

# MQTT broker connection is NOT configured here.
#
# It used to be, and it could never have worked: Home Assistant removed YAML
# configuration of the MQTT broker in favour of a UI config flow, so the
# `mqtt: broker/port/username/password` block that used to sit here was rejected
# outright — "'broker' is an invalid option for 'mqtt'" — and MQTT setup failed, taking
# all four doorboard entities with it. The block was hand-checked against HA's schema
# when it was written and never run against a real HA until 2026-08-20.
#
# Set it up once via Settings -> Devices & Services -> Add Integration -> MQTT:
#   host      mosquitto        (the compose service name; HA is on the same network)
#   port      1883
#   username  home-assistant
#   password  MQTT_HA_PASSWORD from the NUC's .env
#
# HA stores that in its own `.storage/`, which lives in the `ha_data` volume and
# survives restarts and image updates — so this is genuinely once, not once per deploy.
#
# Discovery needs no flag: `ha-discovery-publisher` writes the four config messages
# retained, so HA picks them up whenever the integration connects, in either order.

rest_command: !include rest_commands.yaml
automation: !include automations.yaml
