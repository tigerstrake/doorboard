# Phone -> presence bridge (T-503/T-504).
#
# Two inputs, one destination:
#
#   Focus    -> an iOS Shortcuts personal automation POSTs to this webhook when
#               your Focus changes. HA cannot see Focus itself, so the phone has
#               to tell it.
#   Location -> the HA companion app already reports zones, so no Shortcut is
#               needed; the zone automation below reacts to them directly.
#
# Both send a LABEL, never coordinates. control-plane-api rejects any
# coordinate-shaped field at any depth (reject_coordinate_payload), so this
# cannot quietly become a location history. The source is fixed by which
# endpoint is called, not by the body, so a caller cannot promote itself up the
# precedence order (manual > focus_shortcut > geofence_label > calendar >
# default).
#
# Presence is display-only. ARCHITECTURE.md 9: personalization is never
# authorization — this changes what the wallboard says, and nothing else. ADR-0002
# also holds: if HA is down the door is unaffected, presence just goes stale and
# the tile says so.
#
# Point an iOS Shortcuts automation at:
#   http://<nuc-lan-host>:8123/api/webhook/doorboard-presence-label
# with body: {"subject_id": "owner", "label": "busy"}
#
# Valid labels: available, busy, do_not_disturb, sleeping, at_class, at_library,
# away, unknown. Anything else is a 422 rather than a silent default.
- id: doorboard_presence_label_webhook
  alias: "Doorboard: forward a Focus change to control-plane-api"
  mode: queued
  max: 10
  triggers:
    - trigger: webhook
      webhook_id: doorboard-presence-label
      allowed_methods:
        - POST
      local_only: true
  actions:
    - action: rest_command.presence_focus_update
      data:
        subject_id: "{{ trigger.json.subject_id }}"
        label: "{{ trigger.json.label }}"

# Location -> presence, straight from the companion app's zones.
#
# `zone.home` and a `zone.campus` you create in HA (Settings -> Areas & Zones).
# Deliberately coarse: the label says "away" or "available", never where. Add
# more zones by extending the mapping below — keep them to labels the contract
# already has.
- id: doorboard_presence_from_zone
  alias: "Doorboard: forward a location change to control-plane-api"
  mode: queued
  max: 10
  triggers:
    - trigger: state
      # CHECK THIS ONE VALUE. HA derives the entity id from the person's name in
      # Settings -> People; person.tiger is a guess. Developer Tools -> States,
      # filter for "person." to see the real id. A wrong id here fails silently:
      # the automation simply never triggers.
      entity_id: person.tiger
  conditions:
    # Ignore the momentary unknown/unavailable flaps the app produces on
    # restart, which would otherwise publish "away" while you are sitting there.
    - condition: template
      value_template: >-
        {{ trigger.to_state.state not in ['unknown', 'unavailable', 'none']
           and trigger.to_state.state != trigger.from_state.state }}
  actions:
    - action: rest_command.presence_geofence_update
      data:
        subject_id: "owner"
        # One expression, not an {% if %} ladder: a folded block scalar turns
        # each newline into a space, so the ladder would have rendered
        # " available " and been rejected as an invalid label.
        label: >-
          {{ {'home': 'available',
              'Campus': 'at_class', 'campus': 'at_class',
              'Library': 'at_library', 'library': 'at_library'}
             .get(trigger.to_state.state, 'away') }}

- id: doorboard_bell_push
  alias: "Doorboard: notify when the bell rings"
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.doorboard_doorboard_bell
      to: "on"
  actions:
    - action: notify.notify
      data:
        title: "Someone's at the door"
        message: "The doorbell just rang."
        data:
          # iOS companion app: bypass Focus for a doorbell, it's time-critical.
          push:
            interruption-level: time-sensitive

- id: doorboard_archive_stalled_push
  alias: "Doorboard: notify when clips stop reaching the NAS"
  mode: single
  triggers:
    # `for` avoids firing on the normal sawtooth as a clip waits its turn.
    - trigger: numeric_state
      entity_id: sensor.doorboard_doorboard_sync_status
      above: 86400
      for: "01:00:00"
  actions:
    - action: notify.notify
      data:
        title: "Doorboard archive has stalled"
        message: >-
          The oldest clip has been waiting
          {{ states('sensor.doorboard_sync_backlog') }}h to reach the NAS.
          Check door-sync on the Pi and that /mnt/nas is still mounted.

- id: doorboard_storage_critical_push
  alias: "Doorboard: notify when the door's disk is critical"
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.doorboard_doorboard_storage_alert
      to: "critical"
  actions:
    - action: notify.notify
      data:
        title: "Doorboard storage critical"
        message: >-
          The door Pi is nearly out of disk — recording is about to be
          affected. Retention should be pruning; check door-media's logs.
