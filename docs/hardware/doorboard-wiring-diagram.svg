<svg width="1900" height="1550" viewBox="0 0 1900 1550" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Doorboard door assembly wiring reference</title>
<desc>Wiring reference for the Doorboard door-mounted assembly: power distribution, Raspberry Pi 5 with AI HAT+ and its GPIO header pinout, ESP32-S3 door controller and its peripherals, cameras, displays, I2C sensor bus, and ground bus.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
.bx{fill:#ffffff;stroke:#333333;stroke-width:1.5;rx:8;}
.bx-tbd{fill:#f9fafb;stroke:#9ca3af;stroke-width:1.5;stroke-dasharray:5,4;rx:8;}
.bx-core{fill:#eef2ff;stroke:#3730a3;stroke-width:2;rx:8;}
.bx-gpio{fill:#fefce8;stroke:#a16207;stroke-width:1.5;rx:8;}
.ti{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#111827;}
.ts{font-family:Arial,Helvetica,sans-serif;font-size:12.5px;fill:#374151;}
.tr{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#1f2937;}
.tag{font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;}
.section{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#6b7280;letter-spacing:1px;}
.wire-pwr{stroke:#b91c1c;stroke-width:2;fill:none;}
.wire-gnd{stroke:#111827;stroke-width:1.5;stroke-dasharray:4,3;fill:none;}
.wire-gpio{stroke:#1d4ed8;stroke-width:2;fill:none;}
.wire-i2c{stroke:#047857;stroke-width:2;fill:none;}
.wire-uart{stroke:#6d28d9;stroke-width:2;fill:none;}
.wire-usb{stroke:#b45309;stroke-width:2;fill:none;}
.wire-video{stroke:#0e7490;stroke-width:2;fill:none;}
.wire-hdmi{stroke:#92400e;stroke-width:2;fill:none;}
.wire-tbd{stroke:#9ca3af;stroke-width:1.5;stroke-dasharray:5,4;fill:none;}
</style>

<text x="30" y="35" class="ti" font-size="22">Doorboard door assembly — wiring reference</text>
<text x="30" y="58" class="ts">Solid colored lines = direct wire. Colored tags = shared rail/bus (same tag = same net, per docs/hardware/wiring.md). Dashed = TBD, confirm at hardware bring-up.</text>

<!-- ===================== ROW 1: POWER SOURCES ===================== -->
<text x="30" y="90" class="section">POWER DISTRIBUTION</text>

<rect x="30" y="100" width="440" height="90" class="bx"/>
<text x="50" y="128" class="ti">Protected DC feed</text>
<text x="50" y="148" class="ts">From inside room, fused at room side.</text>
<text x="50" y="164" class="ts">Crosses hinge in the same strain-relief loop as Ethernet.</text>

<rect x="490" y="100" width="210" height="90" class="bx"/>
<text x="505" y="128" class="ti" font-size="15">Official Pi 5 PSU</text>
<text x="505" y="148" class="ts">27W USB-C, 5V/5A</text>
<rect x="505" y="158" width="70" height="20" rx="4" fill="#fee2e2"/>
<text x="540" y="172" text-anchor="middle" class="tag" fill="#b91c1c">PI 5V</text>

<rect x="720" y="100" width="210" height="90" class="bx"/>
<text x="735" y="128" class="ti" font-size="15">12V DC supply</text>
<text x="735" y="148" class="ts">Feeds displays and IR illuminator.</text>
<rect x="735" y="158" width="80" height="20" rx="4" fill="#fee2e2"/>
<text x="775" y="172" text-anchor="middle" class="tag" fill="#b91c1c">12V RAIL</text>

<rect x="950" y="100" width="210" height="90" class="bx"/>
<text x="965" y="128" class="ti" font-size="15">Buck converter #1</text>
<text x="965" y="148" class="ts">5V regulated, own supply</text>
<text x="965" y="163" class="ts">(never Pi GPIO 5V)</text>
<rect x="965" y="168" width="100" height="20" rx="4" fill="#fee2e2"/>
<text x="1015" y="182" text-anchor="middle" class="tag" fill="#b91c1c">LED 5V RAIL</text>

<rect x="1180" y="100" width="210" height="90" class="bx"/>
<text x="1195" y="128" class="ti" font-size="15">Buck converter #2</text>
<text x="1195" y="148" class="ts">5V regulated, own supply</text>
<text x="1195" y="163" class="ts">(never Pi GPIO 5V)</text>
<rect x="1195" y="168" width="105" height="20" rx="4" fill="#fee2e2"/>
<text x="1247" y="182" text-anchor="middle" class="tag" fill="#b91c1c">AMP 5V RAIL</text>

<rect x="1410" y="100" width="210" height="90" class="bx"/>
<text x="1425" y="128" class="ti" font-size="15">Ethernet uplink</text>
<text x="1425" y="148" class="ts">Single run to NUC control plane,</text>
<text x="1425" y="163" class="ts">same hinge loop as DC feed.</text>

<line x1="595" y1="190" x2="595" y2="222" class="wire-pwr" marker-end="url(#arrow)"/>

<!-- ===================== ROW 2: CORE BOARDS ===================== -->
<text x="30" y="248" class="section">CORE BOARDS</text>

<rect x="260" y="258" width="670" height="230" class="bx-core"/>
<text x="285" y="290" class="ti" font-size="18">Raspberry Pi 5 — 8GB</text>
<rect x="285" y="300" width="70" height="20" rx="4" fill="#fee2e2"/>
<text x="320" y="314" text-anchor="middle" class="tag" fill="#b91c1c">PI 5V</text>
<text x="285" y="345" class="tr">Ports: HDMI0 · HDMI1 · CSI0 · CSI1</text>
<text x="285" y="367" class="tr">USB3 ×2 · USB2 ×2 · Gigabit Ethernet</text>
<text x="285" y="389" class="tr">PCIe → AI HAT+ · USB-C power in</text>
<text x="285" y="418" class="tr" font-weight="700">GPIO header — see detail table below</text>
<text x="285" y="440" class="ts">40-pin header carries UART (↔ ESP32) and I2C1 (↔ sensor bus).</text>
<text x="285" y="460" class="ts">microSD = OS/recovery only. Never active recording/DB.</text>

<rect x="950" y="258" width="210" height="100" class="bx"/>
<text x="965" y="286" class="ti" font-size="15">AI HAT+ 26 TOPS</text>
<text x="965" y="306" class="ts">Hailo-8, PCIe stack on Pi 5</text>
<text x="965" y="322" class="ts">Owns door-visiond. Uses the</text>
<text x="965" y="337" class="ts">Pi's only PCIe lane.</text>

<rect x="950" y="378" width="210" height="110" class="bx"/>
<text x="965" y="406" class="ti" font-size="15">USB3 SSD 512GB</text>
<text x="965" y="426" class="ts">Recordings · SQLite ·</text>
<text x="965" y="441" class="ts">enrollment DB</text>
<rect x="965" y="452" width="80" height="20" rx="4" fill="#fef3c7"/>
<text x="1005" y="466" text-anchor="middle" class="tag" fill="#b45309">USB3</text>

<rect x="1410" y="258" width="440" height="230" class="bx-core"/>
<text x="1435" y="290" class="ti" font-size="18">ESP32-S3-WROOM-1-N8R8</text>
<text x="1435" y="310" class="ts">Door I/O controller · UART 115200 8N1</text>
<rect x="1435" y="320" width="70" height="20" rx="4" fill="#e0e7ff"/>
<text x="1470" y="334" text-anchor="middle" class="tag" fill="#3730a3">5V IN</text>
<text x="1435" y="365" class="tr">GPIO4 → button</text>
<text x="1435" y="387" class="tr">GPIO18 → WS2812B LED data</text>
<text x="1435" y="409" class="tr">I2S: BCLK16 · WS17 · DOUT15 → amp</text>
<text x="1435" y="431" class="tr">UART1: TX43 · RX44 (↔ Pi GPIO14/15)</text>
<text x="1435" y="453" class="tr">ADC1 CH3 → piezo knock sensor</text>
<text x="1435" y="475" class="ts">Pin numbers from firmware/esp32-door-controller/doorboard_pinout.h</text>

<line x1="1160" y1="330" x2="1408" y2="373" class="wire-gpio"/>

<!-- ===================== ROW 3: VIDEO / DISPLAY PERIPHERALS ===================== -->
<text x="30" y="530" class="section">PI VIDEO &amp; DISPLAY PERIPHERALS</text>

<rect x="260" y="540" width="210" height="105" class="bx"/>
<text x="275" y="566" class="ti" font-size="15">Wallboard monitor</text>
<text x="275" y="586" class="ts">21.5–24" 1080p IPS, VESA</text>
<text x="275" y="601" class="ts">← Pi HDMI0</text>
<rect x="275" y="610" width="80" height="20" rx="4" fill="#fee2e2"/>
<text x="315" y="624" text-anchor="middle" class="tag" fill="#b91c1c">12V RAIL</text>
<line x1="365" y1="488" x2="365" y2="538" class="wire-hdmi" marker-end="url(#arrow)"/>

<rect x="490" y="540" width="210" height="105" class="bx"/>
<text x="505" y="566" class="ti" font-size="15">DoorPad touchscreen</text>
<text x="505" y="586" class="ts">7" HDMI touch, 1024×600</text>
<text x="505" y="601" class="ts">← Pi HDMI1 + USB touch</text>
<rect x="505" y="610" width="80" height="20" rx="4" fill="#fee2e2"/>
<text x="545" y="624" text-anchor="middle" class="tag" fill="#b91c1c">12V RAIL</text>
<line x1="595" y1="488" x2="595" y2="538" class="wire-hdmi" marker-end="url(#arrow)"/>

<rect x="720" y="540" width="210" height="105" class="bx"/>
<text x="735" y="566" class="ti" font-size="15">Recognition camera</text>
<text x="735" y="586" class="ts">Camera Module 3 Standard</text>
<text x="735" y="601" class="ts">Chest/face height, 0.8–1.8m</text>
<rect x="735" y="610" width="60" height="20" rx="4" fill="#cffafe"/>
<text x="765" y="624" text-anchor="middle" class="tag" fill="#0e7490">CSI0</text>
<line x1="825" y1="488" x2="825" y2="538" class="wire-video" marker-end="url(#arrow)"/>

<rect x="950" y="540" width="210" height="105" class="bx"/>
<text x="965" y="566" class="ti" font-size="15">Visitor camera</text>
<text x="965" y="586" class="ts">Camera Module 3 Wide NoIR</text>
<text x="965" y="601" class="ts">Full visitor framing</text>
<rect x="965" y="610" width="60" height="20" rx="4" fill="#cffafe"/>
<text x="995" y="624" text-anchor="middle" class="tag" fill="#0e7490">CSI1</text>
<line x1="1055" y1="488" x2="1055" y2="538" class="wire-video" marker-end="url(#arrow)"/>

<rect x="1180" y="540" width="210" height="105" class="bx"/>
<text x="1195" y="566" class="ti" font-size="15">IR illuminator 850nm</text>
<text x="1195" y="586" class="ts">Mounted next to visitor cam,</text>
<text x="1195" y="601" class="ts">low-light upgrade path</text>
<rect x="1195" y="610" width="80" height="20" rx="4" fill="#fee2e2"/>
<text x="1235" y="624" text-anchor="middle" class="tag" fill="#b91c1c">12V RAIL</text>

<!-- ===================== ROW 4: ESP32 PERIPHERALS ===================== -->
<text x="1180" y="530" class="section" text-anchor="start" opacity="0"></text>
<text x="30" y="695" class="section">ESP32 PERIPHERALS</text>

<rect x="1180" y="705" width="210" height="95" class="bx"/>
<text x="1195" y="731" class="ti" font-size="15">Bell button</text>
<text x="1195" y="751" class="ts">Momentary, panel-mount</text>
<rect x="1195" y="760" width="90" height="20" rx="4" fill="#dbeafe"/>
<text x="1240" y="774" text-anchor="middle" class="tag" fill="#1d4ed8">GPIO4</text>
<line x1="1410" y1="373" x2="1285" y2="705" class="wire-gpio" marker-end="url(#arrow)"/>

<rect x="1410" y="705" width="210" height="95" class="bx"/>
<text x="1425" y="731" class="ti" font-size="15">WS2812B ring (16 LED)</text>
<text x="1425" y="751" class="ts">Single data line, level-shift if needed</text>
<rect x="1425" y="760" width="90" height="20" rx="4" fill="#dbeafe"/>
<text x="1470" y="774" text-anchor="middle" class="tag" fill="#1d4ed8">GPIO18</text>
<rect x="1525" y="760" width="100" height="20" rx="4" fill="#fee2e2"/>
<text x="1575" y="774" text-anchor="middle" class="tag" fill="#b91c1c">LED 5V RAIL</text>
<line x1="1600" y1="373" x2="1500" y2="705" class="wire-gpio" marker-end="url(#arrow)"/>

<rect x="1640" y="705" width="210" height="95" class="bx-tbd"/>
<text x="1655" y="731" class="ti" font-size="15">Door reed switch</text>
<text x="1655" y="751" class="ts">Magnetic contact, screw mount</text>
<rect x="1655" y="760" width="140" height="20" rx="4" fill="#f3f4f6"/>
<text x="1725" y="774" text-anchor="middle" class="tag" fill="#6b7280">SPARE GPIO — TBD</text>
<line x1="1750" y1="488" x2="1750" y2="703" class="wire-tbd" marker-end="url(#arrow)"/>

<rect x="1180" y="815" width="210" height="105" class="bx"/>
<text x="1195" y="841" class="ti" font-size="15">Piezo knock sensor</text>
<text x="1195" y="861" class="ts">Ceramic piezo, conditioned input</text>
<rect x="1195" y="870" width="110" height="20" rx="4" fill="#dbeafe"/>
<text x="1250" y="884" text-anchor="middle" class="tag" fill="#1d4ed8">ADC1 CH3</text>
<line x1="1285" y1="800" x2="1285" y2="813" class="wire-gpio" marker-end="url(#arrow)"/>

<rect x="1410" y="815" width="210" height="105" class="bx"/>
<text x="1425" y="841" class="ti" font-size="15">MAX98357A I2S amp</text>
<text x="1425" y="861" class="ts">BCLK16 · WS17 · DOUT15</text>
<rect x="1425" y="870" width="100" height="20" rx="4" fill="#fee2e2"/>
<text x="1475" y="884" text-anchor="middle" class="tag" fill="#b91c1c">AMP 5V RAIL</text>
<line x1="1515" y1="800" x2="1515" y2="813" class="wire-gpio" marker-end="url(#arrow)"/>

<rect x="1640" y="815" width="210" height="105" class="bx"/>
<text x="1655" y="841" class="ti" font-size="15">Speaker</text>
<text x="1655" y="861" class="ts">Small speaker, matched to amp</text>
<text x="1655" y="881" class="ts">← amp output (screw terminals)</text>
<line x1="1620" y1="862" x2="1638" y2="862" class="wire-gpio" marker-end="url(#arrow)"/>

<!-- ===================== ROW 5: GPIO HEADER DETAIL + I2C BUS ===================== -->
<text x="30" y="965" class="section">PI 5 GPIO HEADER — PINS IN USE</text>

<rect x="30" y="975" width="900" height="295" class="bx-gpio"/>
<text x="55" y="1008" class="ti" font-size="16">40-pin GPIO header</text>
<text x="55" y="1027" class="ts">Only the pins below carry a signal. Everything else stays unconnected.</text>

<text x="55" y="1058" class="tr" font-weight="700">Pin</text>
<text x="140" y="1058" class="tr" font-weight="700">Function</text>
<text x="430" y="1058" class="tr" font-weight="700">Goes to</text>
<line x1="55" y1="1066" x2="905" y2="1066" stroke="#a16207" stroke-width="1"/>

<text x="55" y="1092" class="tr">Pin 1 (3.3V)</text>
<text x="140" y="1092" class="tr">3.3V rail</text>
<text x="430" y="1092" class="tr">I2C sensor pull-ups, as needed</text>

<text x="55" y="1120" class="tr">Pin 2 / 4 (5V)</text>
<text x="140" y="1120" class="tr">5V rail</text>
<text x="430" y="1120" class="tr">Not used for peripherals — LED and amp use their own regulated rails, never Pi GPIO 5V</text>

<text x="55" y="1148" class="tr">Pin 3 (GPIO2 / SDA1)</text>
<text x="140" y="1148" class="tr" opacity="0"> </text>
<rect x="430" y="1136" width="70" height="20" rx="4" fill="#d1fae5"/>
<text x="465" y="1150" text-anchor="middle" class="tag" fill="#047857">I2C1 BUS</text>
<text x="510" y="1148" class="tr">→ sensor cluster (right)</text>

<text x="55" y="1176" class="tr">Pin 5 (GPIO3 / SCL1)</text>
<rect x="430" y="1164" width="70" height="20" rx="4" fill="#d1fae5"/>
<text x="465" y="1178" text-anchor="middle" class="tag" fill="#047857">I2C1 BUS</text>
<text x="510" y="1176" class="tr">→ sensor cluster (right)</text>

<text x="55" y="1204" class="tr">Pin 6 / 9 / 14 ... (GND)</text>
<rect x="430" y="1192" width="90" height="20" rx="4" fill="#e5e7eb"/>
<text x="475" y="1206" text-anchor="middle" class="tag" fill="#111827">GND BUS</text>
<text x="530" y="1204" class="tr">common ground, see bottom</text>

<text x="55" y="1232" class="tr">Pin 8 (GPIO14 / TXD0)</text>
<rect x="430" y="1220" width="100" height="20" rx="4" fill="#ede9fe"/>
<text x="480" y="1234" text-anchor="middle" class="tag" fill="#6d28d9">UART LINK</text>
<text x="540" y="1232" class="tr">→ ESP32 GPIO44 (RX)</text>

<text x="55" y="1240" class="tr" opacity="0"> </text>
<text x="55" y="1250" class="ts" font-size="11">Pin 10 (GPIO15 / RXD0) → ESP32 GPIO43 (TX), same UART LINK tag · 115200 8N1</text>

<!-- I2C sensor cluster -->
<rect x="960" y="975" width="660" height="280" class="bx"/>
<text x="985" y="1008" class="ti" font-size="16">I2C1 sensor bus</text>
<rect x="985" y="1018" width="70" height="20" rx="4" fill="#d1fae5"/>
<text x="1020" y="1032" text-anchor="middle" class="tag" fill="#047857">I2C1 BUS</text>
<text x="1065" y="1032" class="ts">Pi GPIO2 (SDA) / GPIO3 (SCL) + 3.3V + GND</text>
<text x="985" y="1054" class="ts" font-weight="700">Verify each module has a unique I2C address before wiring in parallel.</text>

<line x1="985" y1="1070" x2="1610" y2="1070" stroke="#333" stroke-width="1"/>

<text x="1000" y="1098" class="tr">•  SCD41 — CO2 / temperature / humidity</text>
<text x="1000" y="1128" class="tr">•  BH1750 (GY-302) — ambient light</text>
<text x="1000" y="1158" class="tr">•  SGP30 — VOC / eCO2</text>
<text x="1000" y="1188" class="tr">•  PN532 — NFC reader (set to I2C mode)</text>
<text x="1000" y="1225" class="ts">All optional / feature-flagged except SCD41, which is core.</text>

<!-- ===================== ROW 6: MISC + GROUND BUS ===================== -->
<text x="30" y="1300" class="section">USB PERIPHERALS &amp; GROUND</text>

<rect x="30" y="1310" width="210" height="95" class="bx"/>
<text x="45" y="1336" class="ti" font-size="15">USB microphone</text>
<text x="45" y="1356" class="ts">Lavalier or small USB/I2S mic</text>
<rect x="45" y="1365" width="60" height="20" rx="4" fill="#fef3c7"/>
<text x="75" y="1379" text-anchor="middle" class="tag" fill="#b45309">USB</text>
<text x="115" y="1379" class="ts">→ Pi USB2</text>

<rect x="260" y="1310" width="230" height="95" class="bx-tbd"/>
<text x="275" y="1336" class="ti" font-size="15">PMS5003 PM2.5</text>
<text x="275" y="1356" class="ts">UART sensor — Pi's only hardware</text>
<text x="275" y="1370" class="ts">UART is taken by ESP32 link.</text>
<rect x="275" y="1379" width="180" height="20" rx="4" fill="#f3f4f6"/>
<text x="365" y="1393" text-anchor="middle" class="tag" fill="#6b7280">USB-TTL ADAPTER → Pi USB</text>

<rect x="510" y="1310" width="650" height="95" class="bx"/>
<text x="525" y="1336" class="ti" font-size="16">Common ground bus</text>
<text x="525" y="1356" class="ts">Single point in the enclosure. Ties together: Pi GND · ESP32 GND ·</text>
<text x="525" y="1372" class="ts">LED rail GND · Amp rail GND · PSU GND. Fuse the power feed at the room side.</text>
<rect x="525" y="1381" width="70" height="20" rx="4" fill="#e5e7eb"/>
<text x="560" y="1395" text-anchor="middle" class="tag" fill="#111827">GND BUS</text>

<!-- ===================== LEGEND ===================== -->
<rect x="1180" y="1310" width="670" height="200" class="bx"/>
<text x="1200" y="1336" class="ti" font-size="15">Legend</text>

<line x1="1200" y1="1356" x2="1240" y2="1356" class="wire-pwr"/>
<text x="1250" y="1360" class="ts">Power (direct wire)</text>
<line x1="1200" y1="1378" x2="1240" y2="1378" class="wire-gnd"/>
<text x="1250" y="1382" class="ts">Ground (dashed)</text>
<line x1="1200" y1="1400" x2="1240" y2="1400" class="wire-gpio"/>
<text x="1250" y="1404" class="ts">GPIO / digital signal</text>
<line x1="1200" y1="1422" x2="1240" y2="1422" class="wire-i2c"/>
<text x="1250" y="1426" class="ts">I2C bus</text>

<line x1="1500" y1="1356" x2="1540" y2="1356" class="wire-uart"/>
<text x="1550" y="1360" class="ts">UART</text>
<line x1="1500" y1="1378" x2="1540" y2="1378" class="wire-usb"/>
<text x="1550" y="1382" class="ts">USB</text>
<line x1="1500" y1="1400" x2="1540" y2="1400" class="wire-video"/>
<text x="1550" y="1404" class="ts">CSI camera</text>
<line x1="1500" y1="1422" x2="1540" y2="1422" class="wire-hdmi"/>
<text x="1550" y="1426" class="ts">HDMI / display</text>

<rect x="1200" y="1440" width="130" height="20" rx="4" fill="#f3f4f6"/>
<text x="1265" y="1454" text-anchor="middle" class="tag" fill="#6b7280">DASHED BOX = TBD</text>
<text x="1345" y="1454" class="ts">confirm exact pin at bring-up (M1)</text>

<text x="1200" y="1485" class="ts">Colored pill = net label. Two boxes with the same label share that wire/rail —</text>
<text x="1200" y="1500" class="ts">this avoids drawing every power/ground run point-to-point across the diagram.</text>

</svg>
