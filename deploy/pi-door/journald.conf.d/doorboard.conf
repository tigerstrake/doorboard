# Installed to /etc/systemd/journald.conf.d/doorboard.conf by both Pi installers.
#
# Raspberry Pi OS Bookworm ships no rsyslog and journald with Storage=auto and
# no /var/log/journal, so the journal was volatile: after a crash-reboot
# `journalctl -u door-api` showed only the new boot, and the runbook's
# `/var/log/syslog` did not exist. Persistent — but bounded, and on the SSD:
# /var/log/journal is a bind mount of /mnt/ssd/doorboard/journal
# (infra/systemd/var-log-journal.mount), because five services logging JSON
# to a persistent journal on the microSD is exactly the write pattern
# ADR-0007 keeps off the boot card.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=1G
MaxFileSec=1week
