[project]
name = "doorboard-door-visiond"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "doorboard-contracts",
    "doorboard-esp32-link",
    "doorboard-observability",
    "fastapi",
    "uvicorn",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.9",
    # P-256 ECDH + HKDF + AES-GCM for opening sealed remote-enrollment bundles
    # (ADR-0016 §2). Extends ADR-0003's stack list.
    "cryptography>=43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/door_visiond"]
