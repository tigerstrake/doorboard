<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI sandbox — Body Surfers</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
      #app { position: fixed; inset: 0; }
      #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #ui-root { position: absolute; inset: 0; pointer-events: none; }
      #sb-bar {
        position: fixed; left: 8px; top: 8px; z-index: 100; display: flex; flex-wrap: wrap; gap: 4px;
        max-width: 60vw; font: 12px/1.2 ui-monospace, monospace; opacity: .35; transition: opacity .15s;
      }
      #sb-bar:hover { opacity: 1; }
      #sb-bar button { font: inherit; padding: 3px 6px; border-radius: 4px; border: 1px solid #456; background: #fff; cursor: pointer; }
      #sb-bar button.on { background: #ffd23f; }
      #sb-log { position: fixed; left: 8px; bottom: 8px; z-index: 100; font: 11px/1.3 ui-monospace, monospace; color: #9f9; background: rgba(0,0,0,.6); padding: 4px 6px; border-radius: 4px; max-width: 40vw; pointer-events: none; white-space: pre; }
      #sb-log:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="bg"></canvas>
      <div id="ui-root"></div>
    </div>
    <div id="sb-bar"></div>
    <div id="sb-log"></div>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
